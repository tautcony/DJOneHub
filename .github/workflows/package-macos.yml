name: Package macOS

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: false
        default: "v0.2.0"
        type: string

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, universal]
    env:
      PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || 'v0.2.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build tools
        run: brew install pkg-config
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build DMG
        run: ./scripts/build-macos.sh "${{ matrix.arch }}" "${PACKAGE_VERSION}"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJOneHub-macOS-${{ matrix.arch }}-${{ env.PACKAGE_VERSION }}
          path: |
            dist/DJOneHub-macOS-${{ matrix.arch }}-${{ env.PACKAGE_VERSION }}.dmg
            dist/DJOneHub-macOS-${{ matrix.arch }}-${{ env.PACKAGE_VERSION }}.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: DJOneHub-macOS-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
